<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b1020">
<title>Mannequin Playground</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1020;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#eaf2ff;touch-action:none;overscroll-behavior:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#joy,#jump{position:fixed;z-index:10;border-radius:50%;touch-action:none;transition:filter .15s}
#joy{background:radial-gradient(circle,rgba(255,255,255,.1),rgba(255,255,255,.04));border:2px solid rgba(255,255,255,.4)}
#knob{position:absolute;left:25%;top:25%;width:50%;height:50%;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:none}
#jump{background:rgba(255,166,64,.38);border:2px solid rgba(255,214,150,.9);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:.3px;color:#fff}
#jump.down{filter:brightness(1.5);transform:scale(.94)}
body.editing #joy,body.editing #jump{outline:2px dashed #7ee0ff;outline-offset:5px;opacity:1!important;cursor:move}
#gear{position:fixed;z-index:20;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(16,22,44,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-size:22px;line-height:1}
.glass{background:rgba(16,22,44,.78);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,.16);box-shadow:0 22px 50px rgba(0,0,0,.45)}
#panel{position:fixed;z-index:30;top:0;right:0;bottom:0;width:min(330px,88vw);padding:16px 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;touch-action:pan-y;border-radius:20px 0 0 20px;transition:transform .35s cubic-bezier(.22,1,.36,1)}
#panel.hidden{transform:translateX(105%);pointer-events:none}
#panel h1{font-size:18px;font-weight:700;background:linear-gradient(92deg,#ffd36e,#ff7a7a 45%,#7ee0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#panel h2{font-size:12px;font-weight:600;opacity:.65;margin:16px 0 8px;letter-spacing:.3px}
.row{margin-bottom:11px}.row label{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-bottom:6px}.row b{color:#ffd98a;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:8px;background:linear-gradient(90deg,#4d7dff,#9a6bff);outline:none;touch-action:pan-y}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #5b7dff}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #5b7dff}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{flex:1 1 auto;min-width:72px;padding:11px 10px;font:600 12.5px system-ui,sans-serif;color:#eaf2ff;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:11px}
button:active{transform:scale(.97);background:rgba(120,160,255,.3)}
.tg.on{background:linear-gradient(135deg,#5b7dff,#9a6bff);border-color:transparent}
#editbar{position:fixed;z-index:30;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);width:min(520px,94vw);padding:12px 14px;border-radius:16px;display:none}
body.editing #editbar{display:block}
#editbar p{font-size:12px;opacity:.8;margin-bottom:8px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:10px}
body.editing #gear{display:none}
#loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(circle at 50% 40%,#1c2a5c,#080c1c 70%);transition:opacity .6s,visibility .6s;text-align:center;padding:24px}
#loader.done{opacity:0;visibility:hidden}
.ring{width:60px;height:60px;border-radius:50%;border:4px solid rgba(255,255,255,.13);border-top-color:#ffb347;border-right-color:#6ee0ff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadTxt{font-size:13px;letter-spacing:2px;opacity:.75}
</style></head><body>
<canvas id="scene"></canvas>
<div id="joy"><div id="knob"></div></div>
<div id="jump">JUMP</div>
<button id="gear" aria-label="Settings">⚙</button>
<div id="editbar" class="glass">
  <p>Drag the joystick and jump button to place them. Resize here.</p>
  <div class="two">
    <div class="row"><label>Joystick size <b data-v="js"></b></label><input type="range" data-k="js" min="90" max="240" step="2"></div>
    <div class="row"><label>Jump size <b data-v="bs"></b></label><input type="range" data-k="bs" min="60" max="190" step="2"></div>
  </div>
  <div class="btns"><button id="rst2">Reset</button><button id="done" class="tg on">Done</button></div>
</div>
<div id="panel" class="glass hidden">
  <h1>Mannequin Playground</h1>
  <h2>Controls</h2>
  <div class="row"><label>Joystick size <b data-v="js"></b></label><input type="range" data-k="js" min="90" max="240" step="2"></div>
  <div class="row"><label>Jump button size <b data-v="bs"></b></label><input type="range" data-k="bs" min="60" max="190" step="2"></div>
  <div class="row"><label>Control opacity <b data-v="op"></b></label><input type="range" data-k="op" min="25" max="100" step="5"></div>
  <div class="row"><label>Camera distance <b data-v="cd"></b></label><input type="range" data-k="cd" min="2.5" max="9" step=".1"></div>
  <div class="btns"><button id="bEdit">Move controls</button><button id="bRst">Reset layout</button></div>
  <h2>World</h2>
  <div class="row"><label>Time of day <b id="timeVal">14:00</b></label><input type="range" id="timeSlider" min="0" max="24" step=".05" value="14"></div>
  <div class="row"><label>Sun height <b id="sunVal">55°</b></label><input type="range" id="sunSlider" min="0" max="1" step=".01" value=".62"></div>
  <div class="btns" style="margin-bottom:10px"><button data-time="13.2">Noon</button><button data-time="18.6">Dusk</button><button data-time="23.2">Night</button></div>
  <div class="btns"><button id="tgCycle" class="tg">Day cycle</button><button id="tgShadow" class="tg on">Shadows</button><button id="btnBalls">Drop balls</button></div>
  <h2>Performance</h2>
  <div class="btns"><button id="bQ" style="flex:2">Medium</button><button id="bFS">Fullscreen</button></div>
  <p style="font-size:11px;opacity:.6;margin-top:10px;line-height:1.5">Quality adjusts resolution and shadows. It lowers itself automatically if the frame rate drops. Drag the empty screen to look around.</p>
</div>
<div id="loader"><div class="ring"></div><div id="loadTxt">Loading the playground…</div></div>
<script>setTimeout(function(){if(!window.__ok){var t=document.getElementById('loadTxt');if(t)t.textContent='Still loading… if this stays, check your internet connection (the 3D engine loads from a CDN).';}},15000);</script>

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9dc9ee, 55, 190);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, 0.1, 900);
camera.position.set(16, 11, 20);


/* ============================================================
   SKY DOME (gradient + sun glow shader)
   ============================================================ */
const skyUniforms = {
  topColor:    { value: new THREE.Color(0x2c6ed6) },
  bottomColor: { value: new THREE.Color(0xa9d8f7) },
  sunColor:    { value: new THREE.Color(0xfff0c4) },
  sunDir:      { value: new THREE.Vector3(0,1,0) },
  offset:      { value: 0.02 },
  exponent:    { value: 0.72 }
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(400, 48, 32),
  new THREE.ShaderMaterial({
    uniforms: skyUniforms,
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    vertexShader: /* glsl */`
      varying vec3 vWorldPosition;
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        vWorldPosition = wp.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 topColor, bottomColor, sunColor, sunDir;
      uniform float offset, exponent;
      varying vec3 vWorldPosition;
      void main(){
        vec3 dir = normalize(vWorldPosition);
        float h = max(dir.y + offset, 0.0);
        float f = pow(h, exponent);
        vec3 col = mix(bottomColor, topColor, f);
        float sd = max(dot(dir, normalize(sunDir)), 0.0);
        col += sunColor * pow(sd, 220.0) * 1.6;
        col += sunColor * pow(sd, 12.0) * 0.13;
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
sky.frustumCulled = false;
scene.add(sky);

/* ============================================================
   LIGHTS
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xbcdcff, 0x4d7a3f, 0.75);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0x88a6ff, 0.28);
scene.add(ambient);

const MAT = (color, rough=0.72, metal=0.02, extra={}) =>
  new THREE.MeshLambertMaterial(Object.assign({ color }, extra));

function shadows(obj, cast=true, receive=true){
  obj.traverse(o => {
    if (o.isMesh){ o.castShadow = cast; o.receiveShadow = receive; }
  });
  return obj;
}

function makeGrassTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#4c8b3c'; x.fillRect(0,0,256,256);
  for (let i=0;i<2600;i++){
    const px = Math.random()*256, py = Math.random()*256;
    x.fillStyle = Math.random() > 0.5 ? 'rgba(122,186,80,0.42)' : 'rgba(38,88,34,0.42)';
    x.fillRect(px, py, 2, 2 + Math.random()*3);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(26,26);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeSandTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#e3c18d'; x.fillRect(0,0,256,256);
  for (let i=0;i<1800;i++){
    x.fillStyle = Math.random() > 0.5 ? 'rgba(255,230,190,0.5)' : 'rgba(180,140,95,0.42)';
    const s = 1 + Math.random()*2.4;
    x.fillRect(Math.random()*256, Math.random()*256, s, s);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(10,10);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const fenceGroup = new THREE.Group();
{
  const postMat = MAT(0xf2f0e8, 0.78);

  const pts = [];

    const a1 = ((s+1)/sides)*Math.PI*2 + Math.PI/4;
    const p0 = new THREE.Vector3(Math.cos(a0)*R, 0, Math.sin(a0)*R);

      post.position.copy(p); post.position.y = 1.05;

      const dir = p1.clone().sub(p0);
      const len = dir.length();
      const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.13, 0.13), railMat);
      rail.position.copy(p0).lerp(p1, 0.5);
      rail.position.y = hy;
      rail.rotation.y = -Math.atan2(dir.z, dir.x);
      fenceGroup.add(rail);
    }
  }

const swings = [];
function buildSwingSet(){
  const g = new THREE.Group();
  const frameMat = MAT(0xe8503a, 0.55, 0.22);
  const beamMat  = MAT(0xf2b134, 0.55, 0.22);
  const ropeMat  = MAT(0x3c4152, 0.85, 0.1);

  const beamY = 3.25, halfLen = 2.55, legLen = 3.5, tilt = 0.36;
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16, halfLen*2, 14), beamMat);
  beam.rotation.z = Math.PI/2; beam.position.y = beamY;
  g.add(beam);

  for (const x of [-halfLen, halfLen]){
    for (const s of [-1, 1]){
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.17,legLen,12), frameMat);
      leg.position.set(x, beamY - (legLen/2)*Math.cos(tilt), s*(legLen/2)*Math.sin(tilt));
      leg.rotation.x = -s*tilt;
      g.add(leg);
      const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.26,0.12,12), MAT(0xd9432c,0.7,0.15));
      foot.position.set(x, 0.06, s*(legLen/2)*Math.sin(tilt) + s*Math.sin(tilt)*(legLen/2)*0.02);
      g.add(foot);
    }
  }
  // cross brace
  const brace = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1, halfLen*2-0.4, 10), frameMat);
  brace.rotation.z = Math.PI/2; brace.position.y = 1.15;
  g.add(brace);

  const seatCols = [0x3a86c8, 0x4caf50, 0xe0526f];
  for (let i=0;i<3;i++){
    const pivot = new THREE.Group();
    pivot.position.set(-1.85 + i*1.85, beamY - 0.06, 0);
    const ropeLen = 1.95;
    for (const s of [-1,1]){
      const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.032,0.032,ropeLen,7), ropeMat);
      rope.position.set(0, -ropeLen/2, s*0.29);
      pivot.add(rope);
    }
    const seat = new THREE.Mesh(new RoundedBoxGeometry(0.95,0.13,0.62,3,0.05), MAT(seatCols[i],0.6,0.12));
    seat.position.y = -ropeLen;
    pivot.add(seat);
    g.add(pivot);
    swings.push({ pivot, phase: i*1.25, energy: 1, speed: 1.65 + i*0.13 });
  }
  return shadows(g);
}

function ribbonGeometry(curve, width, segments, depth, across=14){
  const points = curve.getSpacedPoints(segments);
  const pos = [], uv = [], idx = [];
  const up0 = new THREE.Vector3(0,1,0);
  for (let i=0;i<=segments;i++){
    const t = i/segments;
    const p = points[i];
    const tan = curve.getTangentAt(Math.min(t,1)).normalize();
    const right = new THREE.Vector3().crossVectors(tan, up0).normalize();
    const up = new THREE.Vector3().crossVectors(right, tan).normalize();
    for (let j=0;j<=across;j++){
      const s = j/across*2 - 1;
      const v = p.clone()
        .addScaledVector(right, s*width/2)
        .addScaledVector(up, depth*(s*s) );
      pos.push(v.x, v.y, v.z);
      uv.push(j/across, t*5);
    }
  }
  for (let i=0;i<segments;i++){
    for (let j=0;j<across;j++){
      const a = i*(across+1)+j, b = a+1, c = a+across+1, d = c+1;
      idx.push(a,c,b, b,c,d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function buildSlide(){
  const g = new THREE.Group();
  const woodMat = MAT(0xe2b26a, 0.82);
  const railMat = MAT(0xe8503a, 0.5, 0.2);
  const deckMat = MAT(0x3a86c8, 0.55, 0.18);
  const slideMat = MAT(0x2fa8a0, 0.36, 0.24, { side: THREE.DoubleSide });

  // deck
  const deck = new THREE.Mesh(new RoundedBoxGeometry(3.0,0.22,3.0,4,0.09), deckMat);
  deck.position.set(0, 2.4, 0);
  g.add(deck);

  // legs
  for (const x of [-1.25,1.25]) for (const z of [-1.25,1.25]){
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.18,2.4,10), woodMat);
    leg.position.set(x,1.2,z);
    g.add(leg);
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.26,0.14,10), MAT(0xc79055,0.85));
    foot.position.set(x,0.07,z);
    g.add(foot);
  }

  // railing posts + rails
  for (const [x,z] of [[-1.42,-1.42],[1.42,-1.42],[-1.42,1.42],[1.42,1.42]]){
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,1.25,9), railMat);
    p.position.set(x, 3.12, z);
    g.add(p);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.12,12,10), MAT(0xf2b134,0.5,0.2));
    cap.position.set(x, 3.76, z);
    g.add(cap);
  }
  for (const z of [-1.42,1.42]){
    const r = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,2.84,9), railMat);
    r.rotation.z = Math.PI/2; r.position.set(0,3.62,z);
    g.add(r);
    const r2 = r.clone(); r2.position.y = 3.12; g.add(r2);
  }
  for (const x of [-1.42,1.42]){
    const r = new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,2.84,9), railMat);
    r.rotation.x = Math.PI/2; r.position.set(x,3.62,0);
    g.add(r);
    const r2 = r.clone(); r2.position.y = 3.12; g.add(r2);
  }

  // roof
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.6,1.25,4), MAT(0xe0526f,0.62,0.12));
  roof.position.set(0, 4.45, 0);
  roof.rotation.y = Math.PI/4;
  g.add(roof);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.19,14,12), MAT(0xf2b134,0.45,0.35));
  knob.position.set(0,5.15,0);
  g.add(knob);

  // ladder (front, +z)
  const railA = new THREE.Mesh(new THREE.BoxGeometry(0.13,2.55,0.13), MAT(0xf2b134,0.55,0.22));
  for (const x of [-0.62,0.62]){
    const r = railA.clone();
    r.position.set(x, 1.3, 1.95);
    r.rotation.x = -0.28;
    g.add(r);
  }
  for (let i=0;i<7;i++){
    const t = i/6;
    const step = new THREE.Mesh(new RoundedBoxGeometry(1.32,0.11,0.32,3,0.04), MAT(0x3a86c8,0.55,0.18));
    step.position.set(0, 0.28 + t*2.05, 2.42 - t*0.62);
    g.add(step);
  }

  // slide surface (curved ribbon, pointing -z)
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 2.42, -1.55),
    new THREE.Vector3(0, 2.36, -2.35),
    new THREE.Vector3(0, 2.02, -3.35),
    new THREE.Vector3(0, 1.42, -4.35),
    new THREE.Vector3(0, 0.78, -5.35),
    new THREE.Vector3(0, 0.32, -6.35),
    new THREE.Vector3(0, 0.16, -7.15)
  ]);
  const surf = new THREE.Mesh(ribbonGeometry(curve, 1.65, 90, 0.3), slideMat);
  g.add(surf);

  // slide side rails
  for (const side of [-1,1]){
    const pts = [];
    for (let i=0;i<=40;i++){
      const t = i/40;
      const p = curve.getPointAt(t);
      const tan = curve.getTangentAt(t).normalize();
      const right = new THREE.Vector3().crossVectors(tan, new THREE.Vector3(0,1,0)).normalize();
      pts.push(p.clone().addScaledVector(right, side*0.83).add(new THREE.Vector3(0,0.22,0)));
    }
    const rc = new THREE.CatmullRomCurve3(pts);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(rc, 60, 0.115, 10, false), MAT(0xf2b134,0.48,0.25)));
  }

  return shadows(g);
}

/* ============================================================
   TIME OF DAY
   ============================================================ */
const skyStops = {
  night:  { top:new THREE.Color(0x030821), bot:new THREE.Color(0x12224e), sun:new THREE.Color(0x4459a8) },
  dusk:   { top:new THREE.Color(0x2b2a72), bot:new THREE.Color(0xff9351), sun:new THREE.Color(0xffa14f) },
  day:    { top:new THREE.Color(0x2262d4), bot:new THREE.Color(0xa8d9f8), sun:new THREE.Color(0xfff3cf) }
};
const _c1 = new THREE.Color(), _c2 = new THREE.Color();

let dayTime = 14;         // hours
let sunHeight = 0.62;     // 0..1 multiplier of elevation
let nightFactor = 0;

function setTimeOfDay(){
  const angle = (dayTime/24)*Math.PI*2 - Math.PI/2;
  const dist = 46;
  sun.position.set(Math.cos(angle)*dist, Math.sin(angle)*dist*sunHeight + 2.5, Math.sin(angle*0.65)*16 + 12);
  sunBase.copy(sun.position);

  const k = THREE.MathUtils.clamp(sun.position.y/32, -1, 1);
  nightFactor = 1 - THREE.MathUtils.smoothstep(k, -0.12, 0.3);

  let top, bot, sunC;
  if (k < 0){
    const f = THREE.MathUtils.clamp(k + 1, 0, 1);
    top = _c1.copy(skyStops.night.top).lerp(skyStops.dusk.top, f).clone();
    bot = _c2.copy(skyStops.night.bot).lerp(skyStops.dusk.bot, f).clone();
    sunC = skyStops.night.sun.clone().lerp(skyStops.dusk.sun, f);
  } else {
    const f = THREE.MathUtils.clamp(k/0.55, 0, 1);
    top = skyStops.dusk.top.clone().lerp(skyStops.day.top, f);
    bot = skyStops.dusk.bot.clone().lerp(skyStops.day.bot, f);
    sunC = skyStops.dusk.sun.clone().lerp(skyStops.day.sun, f);
  }
  skyUniforms.topColor.value.copy(top);
  skyUniforms.bottomColor.value.copy(bot);
  skyUniforms.sunColor.value.copy(sunC);
  skyUniforms.sunDir.value.copy(sun.position).normalize();

  scene.fog.color.copy(bot);
  sun.color.copy(sunC);
  sun.intensity = 0.18 + Math.max(0,k)*2.25;
  hemi.intensity = 0.16 + Math.max(0,k)*0.85;
  hemi.color.copy(top).lerp(new THREE.Color(0xffffff), 0.45);
  ambient.intensity = 0.14 + nightFactor*0.22;
  rim.intensity = 0.18 + (1-Math.abs(k))*0.42;

  const lampPower = nightFactor*2.5;
  lampLights.forEach(l=>{
    if (l.light) l.light.intensity = lampPower*14;
    l.mat.emissiveIntensity = 0.25 + nightFactor*2.4;
  });

  fireflies.material.opacity = nightFactor*0.92;
  renderer.toneMappingExposure = 1.02 + nightFactor*0.16;

  // UI
  const hh = Math.floor(dayTime) % 24;
  const mm = Math.floor((dayTime % 1) * 60);
  timeVal.textContent = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
  sunVal.textContent = Math.round(THREE.MathUtils.clamp(k,-1,1) * 90) + '°';
}

/* static-scene merge: hundreds of meshes -> ~35 draw calls */
function mergeStatic(){
  [...swings.map(s=>s.pivot),carousel.group,seesaw.pivot,rider.group,...balloons.map(b=>b.g),...clouds.map(c=>c.g)].forEach(g=>g.traverse(o=>o.userData.keep=1));
  scene.updateMatrixWorld(true);
  const B=new Map(),dead=[];
  scene.traverse(o=>{
    if(!o.isMesh||o.userData.keep||!o.material.isMeshLambertMaterial||o.material.transparent||o.material.map)return;
    const m=o.material,k=m.color.getHex()+'|'+m.side;
    let g=o.geometry.clone();g.applyMatrix4(o.matrixWorld);g.deleteAttribute('uv');if(g.index)g=g.toNonIndexed();
    if(!B.has(k))B.set(k,{m,gs:[]});B.get(k).gs.push(g);dead.push(o);
  });
  dead.forEach(o=>{o.parent.remove(o);o.geometry.dispose();});
  B.forEach(({m,gs})=>{const me=new THREE.Mesh(BGU.mergeGeometries(gs),m);me.castShadow=me.receiveShadow=true;me.matrixAutoUpdate=false;scene.add(me);});
}
try{mergeStatic();}catch(e){console.warn('merge failed',e);}

const PB=[[0,.99,0],[0,1.04,0],[0,1.16,0],[0,1.29,0],[0,1.44,0],[0,1.5,0],[-.035,1.39,0],[-.14,1.345,0],[-.155,1.13,0],[-.165,.87,0],[.035,1.39,0],[.14,1.345,0],[.155,1.13,0],[.165,.87,0],
 [-.075,.93,0],[-.068,.535,0],[-.062,.09,0],[-.062,.03,.11],[.075,.93,0],[.068,.535,0],[.062,.09,0],[.062,.03,.11]];
const RQ=[[.006458545995471647,0,0,.9999791433743128],[-.08015543156917052,0,0,.9967823768455981],[0,0,0,1],[.012885409271979295,0,0,.999916979667759],[0,0,0,1],[0,0,0,1],
 [-.16242576496059946,.45146776860692767,-.8723504459017216,.09380524676751135],[-.02461566752642241,.0025622383689898743,-.10349858796972251,.9943216512452312],[0,0,0,1],[0,0,0,1],
 [-.16241494035985882,-.4514641086930379,.8723548002662612,.09380110960066573],[-.024607434417232652,-.0025615542645951767,.10350384632817101,.9943213094399745],[0,0,0,1],[0,0,0,1],
 [0,.010356598632428826,.999946368994241,0],[-.03809132012641002,0,0,.9992742623179223],[.45974028749147416,0,0,.8880534150923902],[.3352419258915605,0,0,.9421320773248927],
 [0,.010367942663475628,.9999462514380095,0],[-.03811224886926359,0,0,.9992734643160136],[.4597488121711071,0,0,.888049001861528],[.33524110372609595,0,0,.9421323698783037]];
const CH={torso:[[.96,0],[1.06,1],[1.18,2],[1.32,3]],neck:[[1.36,3],[1.44,4],[1.5,5]],
 legR:[[.07,16],[.12,15],[.49,15],[.58,14],[.9,14],[.99,0]],legL:[[.07,20],[.12,19],[.49,19],[.58,18],[.9,18],[.99,0]],
 armR:[[.85,9],[.9,8],[1.09,8],[1.17,7],[1.33,7],[1.42,3]],armL:[[.85,13],[.9,12],[1.09,12],[1.17,11],[1.33,11],[1.42,3]]};
const RANGES=[[0,410,null,0],[410,1058,'torso'],[1058,1896,null,5],[1896,2038,'neck'],[2038,3436,'legL'],[3436,5028,'armL'],[5028,6426,'legR'],[6426,8018,'armR']];
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer;
const gl=new GLTFLoader(),parseGLB=s=>new Promise((ok,no)=>gl.parse(b64(s),'',ok,no));
const RO=0.9350;
let jDur=.87,jt=0,shown=false,ready=false,mixer,A={},W={i:1,w:0,r:0,j:0},mode='idle',jumping=false,phase=0,wDur=1,rDur=1,yaw=0,sp=0;
const vel=new THREE.Vector3(),PP=HERO.position;

Promise.all([parseGLB(GLB.m),parseGLB(GLB.w),parseGLB(GLB.r),parseGLB(GLB.j)]).then(([man,wk,rn,jp])=>{
  /* skeleton in mannequin bind pose (Mixamo rotations, arms lowered from T-pose) */
  const bones=NM.map(n=>{const b=new THREE.Bone();b.name='mixamorig'+n;return b;});
  const Q=RQ.map(q=>new THREE.Quaternion(...q)),restW=[],bindW=[],V=(a)=>new THREE.Vector3(...a);
  NM.forEach((n,i)=>{const p=PAR[i];restW[i]=(p<0?new THREE.Quaternion():restW[p].clone()).multiply(Q[i]);
    let loc=Q[i];
    if(i===7||i===11){const dir=new THREE.Vector3(0,1,0).applyQuaternion(restW[i]),tg=new THREE.Vector3(i===7?-.07:.07,-1,0).normalize();
      const corr=new THREE.Quaternion().setFromUnitVectors(dir,tg);loc=bindW[p].clone().invert().multiply(corr.multiply(restW[i]));}
    bindW[i]=(p<0?new THREE.Quaternion():bindW[p].clone()).multiply(loc);
    bones[i].quaternion.copy(loc);
    bones[i].position.copy(p<0?V(PB[i]):V(PB[i]).sub(V(PB[p])).applyQuaternion(bindW[p].clone().invert()));
    if(p>=0)bones[p].add(bones[i]);
  });
  /* skin weights from body-part vertex ranges */
  const src=man.scene.getObjectByProperty('isMesh',true),geo=src.geometry,pos=geo.attributes.position,n=pos.count;
  const si=new Uint16Array(n*4),sw=new Float32Array(n*4);
  for(const [a,b,ch,fix] of RANGES)for(let v=a;v<b;v++){
    let b0=fix||0,b1=0,w1=0;
    if(ch){const c=CH[ch],y=pos.getY(v);
      if(y<=c[0][0])b0=c[0][1];else if(y>=c[c.length-1][0])b0=c[c.length-1][1];
      else for(let k=0;k<c.length-1;k++)if(y<=c[k+1][0]){b0=c[k][1];b1=c[k+1][1];w1=(y-c[k][0])/(c[k+1][0]-c[k][0]);break;}}
    si[v*4]=b0;si[v*4+1]=b1;sw[v*4]=1-w1;sw[v*4+1]=w1;
  }
  geo.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(si,4));geo.setAttribute('skinWeight',new THREE.Float32BufferAttribute(sw,4));
  geo.deleteAttribute('uv');
  const sm=new THREE.SkinnedMesh(geo,new THREE.MeshLambertMaterial({color:0xe2e2e8}));
  sm.frustumCulled=false;sm.castShadow=true;
  HERO.add(bones[0]);HERO.add(sm);HERO.updateMatrixWorld(true);
  sm.bind(new THREE.Skeleton(bones),sm.matrixWorld);
  /* clips: keep skeleton tracks, in-place root, cm->m */
  const K=.0095,names=new Set(NM.map(n=>'mixamorig'+n));
  const prep=(g,amp)=>{const c=g.animations[0];c.tracks=c.tracks.filter(t=>{
    if(!names.has(t.name.split('.')[0]))return false;
    if(t.name==='mixamorigHips.position'){const v=t.values,y0=v[1];for(let i=0;i<v.length;i+=3){v[i]=0;v[i+2]=0;v[i+1]=(y0+(v[i+1]-y0)*amp)*K;}}
    if(t.name.endsWith('.quaternion')){const r=Q[NM.indexOf(t.name.slice(9,-11))],qa=new THREE.Quaternion(),v=t.values;
      for(let i=0;i<v.length;i+=4){qa.fromArray(v,i);qa.premultiply(r).toArray(v,i);}}
    return true;});return c;};
  const cW=prep(wk,1),cR=prep(rn,1),cJ=prep(jp,1.3);jDur=cJ.duration;wDur=cW.duration;rDur=cR.duration;
  const T=[0,3.2],tr=[new THREE.VectorKeyframeTrack('mixamorigHips.position',T,[0,.99,0,0,.99,0])];
  NM.forEach((nm,i)=>{const q=bones[i].quaternion;let ts=T,vs=[...q.toArray(),...q.toArray()];
    if(i===3){const q2=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),.025).multiply(q);ts=[0,1.6,3.2];vs=[...q.toArray(),...q2.toArray(),...q.toArray()];}
    tr.push(new THREE.QuaternionKeyframeTrack('mixamorig'+nm+'.quaternion',ts,vs));});
  const cI=new THREE.AnimationClip('idle',3.2,tr);
  mixer=new THREE.AnimationMixer(HERO);
  A.i=mixer.clipAction(cI);A.w=mixer.clipAction(cW);A.r=mixer.clipAction(cR);A.j=mixer.clipAction(cJ);
  A.j.setLoop(THREE.LoopOnce,1);A.j.clampWhenFinished=true;A.w.timeScale=0;A.r.timeScale=0;
  for(const k in A){A[k].play();A[k].setEffectiveWeight(k==='i'?1:0);}
  ready=true;
}).catch(e=>{const d=document.createElement('div');d.style.cssText='position:fixed;top:64px;left:12px;right:12px;z-index:50;color:#ffb4b4;font:12px monospace;background:rgba(0,0,0,.7);padding:8px;border-radius:8px';d.textContent='Mannequin failed: '+e;document.body.appendChild(d);});

/* ================= FRAME TICK ================= */
const CV=new THREE.Vector3(),TG=new THREE.Vector3();let acc=0,fr=0,warm=0;
function tick(dt){
  let ix=st.x,iy=st.y,im=st.m;
  const kx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),ky=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  if(kx||ky){const l=Math.hypot(kx,ky);ix=kx/l;iy=ky/l;im=(keys.ShiftLeft||keys.ShiftRight)?1:.5;}
  im=im<.1?0:Math.min(1,(im-.1)/.9);
  jumpQ=Math.max(0,jumpQ-dt);
  if(ready){
    if(im>0)mode=(mode==='run'?im>.5:im>.62)?'run':'walk';else mode='idle';
    sp=mode==='run'?4+.93*Math.min(1,Math.max(0,(im-.5)/.5)):mode==='walk'?.9+.82*Math.min(1,im/.62):0;
    const dx=-Math.sin(cy)*iy+Math.cos(cy)*ix,dz=-Math.cos(cy)*iy-Math.sin(cy)*ix,dl=Math.hypot(dx,dz)||1;
    const tx=im>0?dx/dl*sp:0,tz=im>0?dz/dl*sp:0,k=1-Math.exp(-dt*(jumping?2.5:9));
    vel.x+=(tx-vel.x)*k;vel.z+=(tz-vel.z)*k;
    PP.x+=vel.x*dt;PP.z+=vel.z*dt;
    for(const [cx,cz,r] of COL){const ex=PP.x-cx,ez=PP.z-cz,d=Math.hypot(ex,ez),m=r+.3;if(d<m&&d>1e-4){PP.x=cx+ex/d*m;PP.z=cz+ez/d*m;}}
    PP.x=Math.max(-18.4,Math.min(18.4,PP.x));PP.z=Math.max(-18.4,Math.min(18.4,PP.z));
    if(Math.hypot(vel.x,vel.z)>.3){let d=Math.atan2(vel.x,vel.z)-yaw;d=Math.atan2(Math.sin(d),Math.cos(d));yaw+=d*Math.min(1,dt*12);}
    HERO.rotation.y=yaw;
    if(jumping){jt+=dt;if(jt>=jDur-.03)jumping=false;}
    if(jumpQ>0&&!jumping){jumping=true;jumpQ=0;jt=0;A.j.reset().play();}
    const tg={i:!jumping&&mode==='idle'?1:0,w:!jumping&&mode==='walk'?1:0,r:!jumping&&mode==='run'?1:0,j:jumping?1:0},kw=1-Math.exp(-dt*(jumping?22:12));
    for(const key in tg){W[key]+=(tg[key]-W[key])*kw;A[key].setEffectiveWeight(W[key]);}
    if(mode!=='idle')phase=(phase+dt*(mode==='run'?sp/3.29:sp/1.752))%1;
    A.w.time=phase*wDur;A.r.time=((phase+RO)%1)*rDur;
    mixer.update(dt);
  }
  /* follow camera */
  cd+=(lay.d-cd)*Math.min(1,dt*8);
  TG.set(PP.x,1.35,PP.z);
  CV.set(TG.x+Math.sin(cy)*Math.cos(cp)*cd,Math.max(.5,TG.y+Math.sin(cp)*cd),TG.z+Math.cos(cy)*Math.cos(cp)*cd);
  camera.position.lerp(CV,1-Math.exp(-dt*16));camera.lookAt(TG);
  /* shadows follow player */
  sun.position.copy(sunBase).add(PP);sun.target.position.copy(PP);
  /* auto quality */
  if(ready&&!shown){shown=true;window.__ok=1;$('loader').classList.add('done');}
  if(autoQ&&ready&&++warm>180){acc+=dt;fr++;if(acc>3){const f=fr/acc;acc=fr=0;if(f<36&&lay.q>0)setQ(lay.q-1);}}
}


/* ================= LOOP ================= */
const clock=new THREE.Clock();let elapsed=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05),sdt=dt;elapsed+=sdt;
  // swings
  swings.forEach(s=>{
    const e = s.energy;
    s.pivot.rotation.x = Math.sin(elapsed*s.speed + s.phase) * 0.72 * e;
    s.energy += (1 - s.energy) * dt * 0.32;
    s.speed += (1.72 - s.speed) * dt * 0.25;
  });

  // carousel
  carousel.speed += (carousel.target - carousel.speed) * dt * 1.4;
  carousel.target += (0.65 - carousel.target) * dt * 0.12;
  carousel.group.rotation.y += carousel.speed * sdt;

  // seesaw
  seesaw.angle += (seesaw.target - seesaw.angle) * dt * 2.4;
  seesaw.target += (0 - seesaw.target) * dt * 0.55;
  seesaw.pivot.rotation.z = seesaw.angle + Math.sin(elapsed*1.25)*0.135;

  // spring rider
  rider.group.rotation.z = Math.sin(elapsed*2.2 + rider.phase)*0.2;
  rider.group.position.y = 0.82 + Math.abs(Math.sin(elapsed*2.2 + rider.phase))*0.12;

  // balloons
  balloons.forEach(b=>{
    b.g.position.y = b.baseY + Math.sin(elapsed*b.sp + b.ph)*0.75;
    b.g.rotation.y += dt*0.32;
    b.g.rotation.z = Math.sin(elapsed*0.62 + b.ph)*0.13;
    b.g.position.x += Math.sin(elapsed*0.16 + b.ph)*b.drift*dt*2.2;
    b.g.position.z += Math.cos(elapsed*0.14 + b.ph*1.3)*b.drift*dt*2.2;
  });

  // clouds
  clouds.forEach(c=>{
    c.g.position.x += c.speed * sdt * 1.25;
    if (c.g.position.x > 110) c.g.position.x = -110;
  });

  // fireflies
  if (nightFactor > 0.01){
    const p = fireflies.geometry.attributes.position;
    const seeds = fireflies.userData.seeds;
    for (let i=0;i<seeds.length;i++){
      const s = seeds[i];
      p.array[i*3+1] = s.base + Math.sin(elapsed*s.sp + s.ph)*0.62;
      p.array[i*3]   += Math.sin(elapsed*0.42 + s.ph)*0.006;
      p.array[i*3+2] += Math.cos(elapsed*0.37 + s.ph*1.4)*0.006;
    }
    p.needsUpdate = true;
    fireflies.rotation.y += dt*0.018;
  }

  // balls
  for (let i=balls.length-1;i>=0;i--){
    const b = balls[i];
    b.life += dt;
    b.vel.y -= 16.5 * dt;
    b.mesh.position.addScaledVector(b.vel, dt);
    b.mesh.rotation.x += b.spin.x*dt;
    b.mesh.rotation.z += b.spin.z*dt;
    if (b.mesh.position.y < b.r){
      b.mesh.position.y = b.r;
      b.vel.y *= -0.62;
      b.vel.x *= 0.93;
      b.vel.z *= 0.93;
      b.spin.multiplyScalar(0.86);
      if (Math.abs(b.vel.y) < 0.35) b.vel.y = 0;
    }
    if (b.life > 32 || b.mesh.position.length() > 60){
      scene.remove(b.mesh);
      b.mesh.geometry.dispose();
      b.mesh.material.dispose();
      balls.splice(i,1);
    }
  }

  // day cycle
  if (autoCycle){
    dayTime = (dayTime + dt*0.16) % 24;
    timeSlider.value = dayTime;
    setTimeOfDay();
  }

  tick(dt);
  renderer.render(scene,camera);
}
place();syncUI();setQ(lay.q);setTimeOfDay();animate();
